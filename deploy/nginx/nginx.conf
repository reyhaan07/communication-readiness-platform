upstream backend_upstream {
    server backend:5000;
    keepalive 32;
}

upstream ai_service_upstream {
    server ai-service:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Health check for AWS Load Balancer or EC2 monitoring
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"crp-all-in-one"}';
        add_header Content-Type application/json;
    }

    # Node.js Backend API (matches /api and /api/...)
    location /api {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strip any accidental HSTS / upgrade headers from backend on HTTP
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        add_header Strict-Transport-Security "max-age=0" always;

        # Timeouts for long-running AI queries
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # AI Service (FastAPI / Uvicorn)
    location /ai/ {
        proxy_pass http://ai_service_upstream/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # AI Service Swagger docs (optional inspection)
    location /ai/docs {
        proxy_pass http://ai_service_upstream/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ai/openapi.json {
        proxy_pass http://ai_service_upstream/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Frontend Single Page Application (SPA fallback routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
